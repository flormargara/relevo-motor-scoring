[project]
name = "relevo"
version = "0.1.0"
description = "Motor de decisión de riesgo crediticio para PyMEs y monotributistas"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "httpx>=0.27", "fastapi>=0.115", "jinja2>=3.1", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
sintetico = ["numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
relevo = ["plantillas/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["relevo", "conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/test_fuentes_locales.py" = ["E501"]  # encabezados reales de los CSV de IGJ
