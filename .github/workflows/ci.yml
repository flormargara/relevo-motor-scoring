# Corre lint, formato y tests en cada PR y en cada push a main.
# No necesita data/ (S3) ni credenciales: los tests usan fixtures y adapters falsos.
# El test contra la API real del BCRA queda salteado (RELEVO_EN_VIVO no está seteado).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: pip install -e '.[dev,sintetico]'

      - name: Lint
        run: ruff check src tests

      - name: Formato
        run: ruff format --check src tests

      - name: Tests
        run: pytest -q
